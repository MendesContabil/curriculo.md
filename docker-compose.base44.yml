services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: psicologia
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d psicologia']
      interval: 5s
      timeout: 4s
      retries: 30

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    env_file:
      - ${BASE44_PROJECT_ROOT}/.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: '8000'
      DATABASE_URL: postgres://app:app_dev_password@db:5432/psicologia
      UPLOAD_DIR: /data/uploads
      BASE44_PREVIEW_MODE:
    volumes:
      - ${BASE44_PROJECT_ROOT}/server:/app
      - api-node-modules:/app/node_modules
      - uploads:/data/uploads
    command:
      ['sh', '-ec', 'npm install --no-audit --no-fund --prefer-offline && exec npm run dev']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 75s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    environment:
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    volumes:
      - ${BASE44_PROJECT_ROOT}/web:/app
      - web-node-modules:/app/node_modules
    command:
      ['sh', '-ec', 'npm install --no-audit --no-fund --prefer-offline && exec npm run dev']
    ports:
      - '3000:5173'
    depends_on:
      api:
        condition: service_healthy
    labels:
      base44.project: Gestão Psicológica
      base44.kind: web
      base44.port: '3000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  db-data:
  uploads:
  api-node-modules:
  web-node-modules:
